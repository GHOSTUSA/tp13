global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-cat
    metrics_path: /metrics
    static_configs:
      - targets:
          - cat:8081
        labels:
          service: cat
          pet: cat

  - job_name: api-dog
    metrics_path: /metrics
    static_configs:
      - targets:
          - dog:8081
        labels:
          service: dog
          pet: dog

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090