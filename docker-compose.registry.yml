services:
  registry:
    image: registry
    container_name: registry
    ports:
      - "${REGISTRY_PORT}:${REGISTRY_PORT}"
    environment:
      - REGISTRY_CATALOG_MAXENTRIES=${REGISTRY_CATALOG_MAXENTRIES}
    volumes:
      - registry_data:/var/lib/registry
    restart: always

  registry-ui:
    image: joxit/docker-registry-ui:static
    container_name: registry-ui
    ports:
      - "${REGISTRY_UI_PORT}:80"
    environment:
      - REGISTRY_TITLE=${REGISTRY_TITLE}
      - REGISTRY_URL=http://registry:${REGISTRY_PORT}
      - DELETE_IMAGES=${REGISTRY_DELETE_IMAGES}
      - CATALOG_ELEMENTS_LIMIT=${REGISTRY_CATALOG_ELEMENTS_LIMIT}
      - NGINX_PROXY_PASS_URL=http://registry:${REGISTRY_PORT}
      - SINGLE_REGISTRY=${REGISTRY_SINGLE_REGISTRY}
    depends_on:
      - registry
    restart: always

volumes:
  registry_data:
