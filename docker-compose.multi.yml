services:
  cat:
    image: localhost:${REGISTRY_PORT}/api-tp13:1.0.0
    pull_policy: always
    networks:
      - app-network
    environment:
      - PORT=${API_PORT}
      - PET=${PET_CAT}
    env_file:
      - .env
    expose:
      - "${API_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_PORT}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  dog:
    image: localhost:${REGISTRY_PORT}/api-tp13:1.0.0
    pull_policy: always
    networks:
      - app-network
    environment:
      - PORT=${API_PORT}
      - PET=${PET_DOG}
    env_file:
      - .env
    expose:
      - "${API_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_PORT}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "${NGINX_PORT}:${NGINX_CONTAINER_PORT}"
    networks:
      - app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cat:
        condition: service_healthy
      dog:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_CONTAINER_PORT}"
    networks:
      - default
      - app-network
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      cat:
        condition: service_healthy
      dog:
        condition: service_healthy
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
    restart: unless-stopped

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: node-exporter
    command:
      - --path.rootfs=/host
    ports:
      - "${NODE_EXPORTER_PORT}:${NODE_EXPORTER_CONTAINER_PORT}"
    networks:
      - default
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped

  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: cadvisor
    privileged: true
    ports:
      - "${CADVISOR_PORT}:${CADVISOR_CONTAINER_PORT}"
    networks:
      - default
    volumes:
      - /:/rootfs:ro,rslave
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_CONTAINER_PORT}"
    networks:
      - default
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/tp13-observability.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
