services:
  cat:
    image: localhost:${REGISTRY_PORT}/api-tp13:1.0.0
    pull_policy: always
    networks:
      - app-network
    environment:
      - PORT=${API_PORT}
      - PET=${PET_CAT}
    env_file:
      - .env
    expose:
      - "${API_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_PORT}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  dog:
    image: localhost:${REGISTRY_PORT}/api-tp13:1.0.0
    pull_policy: always
    networks:
      - app-network
    environment:
      - PORT=${API_PORT}
      - PET=${PET_DOG}
    env_file:
      - .env
    expose:
      - "${API_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_PORT}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "${NGINX_PORT}:80"
    networks:
      - app-network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cat:
        condition: service_healthy
      dog:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
